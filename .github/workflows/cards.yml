name: Profile cards

on:
  schedule:
    - cron: "0 19 * * *" # daily, 00:00 Asia/Karachi
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "docs/index.html", "assets/icons/**", ".github/workflows/cards.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cards and dashboard data
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile cards [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
