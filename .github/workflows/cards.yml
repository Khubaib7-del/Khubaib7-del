name: Profile cards

on:
  schedule:
    - cron: "0 19 * * *" # daily, 00:00 Asia/Karachi
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_cards.py", ".github/workflows/cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build_cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile cards [skip ci]"
            git push
          fi
